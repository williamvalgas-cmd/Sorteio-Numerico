<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400..900&display=swap" rel="stylesheet">
    <title>DevSorteio</title>
</head>
<body>

    <header>
        <img src="./img/die.gif" alt="dado-de-6-lados"> 

        <h1>DevSorteio</h1>
    </header>

    <main>
        <h2>Sortear um número</h2>

        <section>
            <input id="input-min" placeholder="menor valor" type="number">
            <input id="input-max" placeholder="maior valor" type="number">
        </section>

        <div id="card" class="card">
            <span id="result">?</span>
        </div>
 
        <button onclick="validationValues()">Sortear</button>
    </main>
    
</body>
<script src="script.js"></script>
</html>
